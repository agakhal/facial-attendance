<!DOCTYPE html> <!--tells web browser this doc is written in HTML-->
<html> <!--opening tag for webpage code-->
	<head> <!--holds background info abt webpage like title fonts etc-->
		<title> Signup Form</title> <!-- sets the text that appears on browser tab at top -->
		</head> <!--closes head section-->
		<body> <!-- the main container for everything user actually sees on the screen headers text boxes buttons etc-->
			<!-- -->
			<nav style="background: #1e293b; padding: 15px; margin-bottom: 20px; font-family: sans-serif;"
			<!-- makes background dark grey blue color, adds space so text doesnt touch top/bottom edge, creates 20px empty space below bar so doesnt touch vid camera, changes font-->
			<a href="attendance.html" style=color: white; text-decoration: none; font-weight: bold;> Go to attendance page</a>
			<!-- a stands for anchor, tells browser make whatever text or image inside this tag clickable, href is hypertext reference tells browser where to go when the link is clicked, this is the name of the file u want to open-->
			</nav>
			<video id = "cameraLens" width = "400" height = "300" autoplay style = "border: 1px solid black;"></video><br>
			<!--creates an empty box on your webpage that displays the live stream from your laptops camera.-->
			<button type = "button" onclick = "clickPic()"> Click Picture </button><br><br>
			<!--draws a clickable button labelled click Picture -->
			<img id = "photoPreview" width = "400" height = "300" style = "display: none; border: 2px solid blue; margin-bottom: 10px;" alt = "Photo Preview">
			<canvas id = "Capture" width = "400" height = "300" style = "display : none;"> </canvas>
			<!-- freezes video fram secretly to save picture-->
			
			<h2> Checkin Student</h2> <!-- h2 means medium size header displaying signup student-->
			
			<input type = "hidden" id = "faceVector" placeholder = "FaceData"> <br><br> 
			<button onclick = "addStudentToDatabase()"> Enter</button> <!--creates a clickable button enter and tells browser to go run java function addstudenttodatabase-->
			<p id = "responseMessage"></p> <!-- creates empty paragraph tag and gives unique label id so java can insert springboots reply text ie studnet has signed up successfully-->
		
			<script>
				async function startCamera() { 
					let photo = await navigator.mediaDevices.getUserMedia({video:true});
					document.getElementById("cameraLens").srcObject=photo;
				}
				startCamera();
				//waits for camera permission then saves data 
				// once user gives camera permission the cmera feed is saved inside photo variable and 
				//queries the built in media system to gain access to laptops hardware camera
				//finds video id cemera lens and links live video data into it so it displays on screen
			
				function clickPic() {
					let video = document.getElementById("cameraLens");
					let capturedPic = document.getElementById("Capture");
					
					capturedPic.getContext("2d").drawImage(video, 0, 0, 400, 300);
				//unlocks 2d drawing toolkit and built in drawing method that copies an image
					document.getElementById("faceVector").value = capturedPic.toDataURL("image/jpeg");
					//finds input id facevector on webpage and inserts the long image text generated by toDataURL 
				let previewBox = document.getElementById("photoPreview");
				let imageData = capturedPic.toDataURL("image/jpeg");
				previewBox.src = imageData;
				previewBox.style.display = "block";
				
				}
				
				async function addStudentToDatabase() {
					//everything runs here only when enter button is clicked
				
				let vector = document.getElementById("faceVector").value;
				//document refers to entire html webpage, getelement.. searches the page for html element
				//that has id = "" .value extracts whatever text user entered into that specific text box
				//let id stores that extracted text inside temporrary java variable named id 
				
				let studentData = { //JSON package
				
				faceVector : vector
			};
			let response  = await fetch ('/api/FaceMetrics/checkin' ,{ // holds the computers response to request in reponse variable  //tells pause until server replies  // fetch built in function opens netork connection to talk to server
				method: 'POST', //post means im sprinboot here is new data to save triggers postMapping method
			headers: {'Content-Type' : 'application/json'}, // asks what kind of format of data is inside this package'}    //data inside is written in JSON text format
			body: JSON.stringify(studentData)
			//converts javascript memory object into plain text string(studentData)
			});
			
			let resultResponse = await response.text(); //extract plain text message from serever response
				document.getElementById("responseMessage").innerText = resultResponse; // inner opens box to write inside resultResponse exact words are displayed which are sent back from springboot
			}
			</script> <!-- closes script tag -->
			</body> <!-- closes body tag-->
			</html> <!-- closes html tag-->
